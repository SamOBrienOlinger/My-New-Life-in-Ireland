name: Deploy isolated feature preview to GitHub Pages

on:
  push:
    branches: [ui-ux-engagement-2026-10-25]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-feature-branch-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out unchanged production commit
        uses: actions/checkout@v4
        with:
          ref: d288ab0d9d8edaaf2bbe57bfb97ea84c8fc922ee
          path: production-src
          persist-credentials: false

      - name: Check out the feature commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: preview-src
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Build unchanged production homepage
        shell: bash
        working-directory: production-src
        run: |
          npm ci
          npm run build:pages

      - name: Build feature branch under the preview URL
        shell: bash
        working-directory: preview-src
        env:
          PREVIEW_PAGES_BASE: /My-New-Life-in-Ireland/preview/
        run: |
          npm ci
          npm run typecheck:pages
          npm run test:journeys
          npm run build:pages

      - name: Assemble production and isolated preview
        shell: bash
        run: |
          set -euo pipefail
          test -f production-src/dist-pages/index.html
          test -f preview-src/dist-pages/index.html
          test -f preview-src/dist-pages/fact-or-fiction/index.html
          grep -q '/My-New-Life-in-Ireland/assets/' production-src/dist-pages/index.html
          grep -q '/My-New-Life-in-Ireland/preview/assets/' preview-src/dist-pages/index.html
          mkdir -p combined/preview
          cp -a production-src/dist-pages/. combined/
          cp -a preview-src/dist-pages/. combined/preview/
          test -f combined/index.html
          test -f combined/preview/fact-or-fiction/index.html
          touch combined/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish branch-specific preview while retaining main at site root
        id: deployment
        uses: actions/deploy-pages@v5
